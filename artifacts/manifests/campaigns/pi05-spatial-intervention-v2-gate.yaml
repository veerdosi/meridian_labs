stopping_rule:
  primary_comparison: targeted_dose_8_vs_random_dose_8
  negative_gate:
    condition: targeted target successes are less than or equal to random target successes
    actions:
      - cancel original-distribution and oracle if still held or queued
      - spend no further training SU on this boundary
      - pivot to a multi-task boundary search
  positive_gate:
    condition: targeted target successes strictly exceed random and targeted regression loss does not exceed 0.02
    actions:
      - release original-distribution to complete the fair comparison
      - release oracle only if it answers a remaining scientific question
  regression_gate:
    condition: targeted regression loss exceeds 0.02
    actions:
      - treat the gate as negative
      - cancel original-distribution and oracle if still held or queued
required_record:
  - paired target outcomes
  - Wilson intervals
