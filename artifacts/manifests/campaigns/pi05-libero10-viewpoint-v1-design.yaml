sequential_gate:
  regression_limit: 0.05
  minimum_target_lift_over_each_control: 0.15
  paired_test: exact two-sided sign test on fixed rollout IDs
  maximum_primary_p: 0.05
  stage_1:
    run: [released_checkpoint_baseline, dose8_targeted, dose8_random]
    negative_if: targeted success is not strictly above both baseline and random, or regression loss exceeds 0.05
    on_negative: cancel held original and all medium jobs; record failure honestly
    on_positive: release dose8 original-distribution
  stage_1_complete:
    decisive_if: targeted lift is at least 0.15 over random and original, both paired p-values are at most 0.05, and regression loss is at most 0.05
    promising_if: targeted strictly beats random and original within regression limit but misses an effect-size or significance threshold
    on_decisive: select dose 8 and unlock untouched confirmation
    on_promising: run matched dose24 targeted and random, then release original only after the same directional/regression pre-gate
    otherwise: stop negative
  stage_2_complete:
    decisive_if: dose24 targeted lift is at least 0.15 over random and original, both paired p-values are at most 0.05, and regression loss is at most 0.05
    on_decisive: select dose 24 and unlock untouched confirmation
    otherwise: stop negative
  confirmation:
    pass_if: targeted lift over random is at least 0.15 with paired p at most 0.05 on untouched confirmation, and combined primary-plus-confirmation paired p is at most 0.01
    final_support_requires: primary comparison against random and original, untouched confirmation against random, and primary regression within limit
oracle_policy:
