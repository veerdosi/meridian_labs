extends: artifacts/manifests/science/pi05-spatial-final-map.yaml
status: intervention_confirmed_on_locked_holdout
capability:
  task_suite: libero_spatial
  task_id: 0
  description: compound view/visual stress with two-step replanning and recovery noise
  target_bounds:
    init_state_index: [0.0, 6.0]
    camera_x: [0.08, 0.12]
    camera_yaw_deg: [32.0, 38.0]
    brightness: [0.9, 1.1]
    occlusion: [0.18, 0.28]
    visual_distractors: [3.0, 6.0]
    replan_steps: [2.0, 2.999]
    action_noise: [0.02, 0.03]
locked_holdout:
  target_trials_per_arm: 40
  regression_trials_per_arm: 20
  results:
    released_checkpoint: {target_successes: 21, target_rate: 0.525, target_wilson_95: [0.3749710685, 0.6706477045], regression_successes: 19, regression_rate: 0.95}
    evidence_weighted_targeted_dose_8: {target_successes: 40, target_rate: 1.0, target_wilson_95: [0.9123754607, 1.0], regression_successes: 20, regression_rate: 1.0}
    random_dose_8: {target_successes: 37, target_rate: 0.925, target_wilson_95: [0.8013546984, 0.9741644432], regression_successes: 20, regression_rate: 1.0}
    original_distribution_dose_8: {target_successes: 8, target_rate: 0.2, target_wilson_95: [0.1049986497, 0.3475760738], regression_successes: 18, regression_rate: 0.9}
paired_evidence:
  targeted_vs_random: {wins: 3, losses: 0, ties: 37, two_sided_sign_p: 0.25}
  targeted_vs_original_distribution: {wins: 32, losses: 0, ties: 8, two_sided_sign_p: 0.0000000004656612873}
  targeted_vs_released_checkpoint: {wins: 19, losses: 0, ties: 21, two_sided_sign_p: 0.000003814697265625}
interpretation:
  supported:
    - The preregistered evidence-weighted dose-8 intervention has the highest locked target success of the tested fair arms and stays inside the regression limit.
    - Targeted data has substantially higher value than canonical original-distribution data on this boundary.
    - The locked point-estimate gate against random is positive.
  unresolved:
    - The 3-to-0 targeted advantage over random is not statistically decisive on 40 paired trials.
    - The six-target/two-broad mixture was not component-ablated, so its gain cannot yet be assigned uniquely to concentration, broad support, or their interaction.
    - Cross-task generalization of the selection rule remains untested.
decision:
  selected_arm: targeted
  next_dose: null
  rationale: Saturated 40/40 target success makes more dose on this boundary low value; confirm the selection rule on new tasks and independent seeds.
artifacts:
  result: artifacts/results/pi05-spatial-intervention-v2/RESULT.md
  gate: artifacts/results/pi05-spatial-intervention-v2/gate-decision.json
  experiment_store: artifacts/results/pi05-spatial-intervention-v2/experiment.sqlite
