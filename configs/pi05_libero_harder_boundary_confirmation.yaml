locked_at_utc: 2026-08-23T19:15:45Z
training_launch_gate:
  condition: The selected boundary is the highest-ranked eligible candidate under configs/pi05_libero_multitask_boundary_search.yaml.
  prohibition: Do not launch any training job before repeated validation and canonical-control probes are complete.
arms:
  released_checkpoint: {training_dose: 0}
  targeted: {training_dose: 8}
  random: {training_dose: 8}
  original_distribution: {training_dose: 8}
fairness:
  same_base_checkpoint: true
  equal_training_steps: true
  equal_examples_for_trained_arms: 8
  paired_evaluation_across_arms: true
untouched_holdouts:
  target:
    trials: 60
    seeds: [31000, 31001, 31002, 31003, 31004, 31005, 31006, 31007, 31008, 31009, 31010, 31011, 31012, 31013, 31014, 31015, 31016, 31017, 31018, 31019, 31020, 31021, 31022, 31023, 31024, 31025, 31026, 31027, 31028, 31029, 31030, 31031, 31032, 31033, 31034, 31035, 31036, 31037, 31038, 31039, 31040, 31041, 31042, 31043, 31044, 31045, 31046, 31047, 31048, 31049, 31050, 31051, 31052, 31053, 31054, 31055, 31056, 31057, 31058, 31059]
    init_state_rule: (7 + 17 * trial_index) modulo 50
    perturbation_jitter_seed: 31199
  regression:
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    trials_per_suite: 10
    seeds_by_suite:
      libero_spatial: [32000, 32001, 32002, 32003, 32004, 32005, 32006, 32007, 32008, 32009]
      libero_object: [32100, 32101, 32102, 32103, 32104, 32105, 32106, 32107, 32108, 32109]
