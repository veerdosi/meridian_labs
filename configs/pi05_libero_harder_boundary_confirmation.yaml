    task_rule: (selected task id + trial_index) modulo 10
    init_state_rule: (13 + 19 * trial_index) modulo 50
confirmation_thresholds:
  primary: targeted versus random on paired target trials
  minimum_targeted_gain_over_random: 0.10
  targeted_vs_random_exact_p_max: 0.05
  paired_direction: targeted wins must exceed targeted losses
  minimum_targeted_gain_over_original_distribution: 0.10
  regression_noninferiority_margin_vs_released: 0.05
  required_reporting: [Wilson intervals, paired wins-losses-ties, exact paired p-value, actual PBS SU]
decision:
  confirmed: All confirmation thresholds pass on untouched holdouts.
  not_confirmed: Any primary, original-distribution, or regression threshold fails; report honestly and do not generalize.
