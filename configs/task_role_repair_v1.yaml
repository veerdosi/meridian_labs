        prompt: put the frying pan on the stove
        bddl: configs/task_role_repair_v1/bddl/frying_pan_to_stove.bddl
        commanded_object: chefmate_8_frypan_1
        commanded_joint: chefmate_8_frypan_1_joint0
        other_object: moka_pot_1
        other_joint: moka_pot_1_joint0
        goal_predicate: ["on", chefmate_8_frypan_1, flat_stove_1_cook_region]
      - id: counterfactual
        prompt: put the moka pot on the stove
        bddl: configs/task_role_repair_v1/bddl/moka_pot_to_stove.bddl
        commanded_object: moka_pot_1
        commanded_joint: moka_pot_1_joint0
        other_object: chefmate_8_frypan_1
        other_joint: chefmate_8_frypan_1_joint0
        goal_predicate: ["on", moka_pot_1, flat_stove_1_cook_region]
    expert_profiles:
      chefmate_8_frypan_1:
        grasp_offset_world_m: [0.0, 0.143, 0.016]
        grasp_axis_angle_rad: [2.356, 2.056, 0.116]
        place_offset_world_m: [0.0, 0.130, 0.060]
        table_geom_z_m: 0.899
      moka_pot_1:
        grasp_offset_world_m: [0.0, 0.0, 0.020]
        grasp_axis_angle_rad: [3.142, 0.0, 0.0]
        place_offset_world_m: [0.0, 0.0, 0.060]
        table_geom_z_m: 0.966
    generator_bounds:
      chefmate_8_frypan_1_x_m: [-0.18, 0.14]
      chefmate_8_frypan_1_y_m: [-0.30, -0.08]
      moka_pot_1_x_m: [-0.16, 0.16]
      moka_pot_1_y_m: [-0.09, 0.10]
      minimum_center_separation_m: 0.24
    contrastive_layouts:
      - {id: t18-l0, chefmate_8_frypan_1_xy_m: [-0.18, -0.30], moka_pot_1_xy_m: [0.16, 0.08]}
      - {id: t18-l1, chefmate_8_frypan_1_xy_m: [0.14, -0.30], moka_pot_1_xy_m: [-0.16, 0.08]}
      - {id: t18-l2, chefmate_8_frypan_1_xy_m: [-0.18, -0.18], moka_pot_1_xy_m: [0.12, 0.09]}
      - {id: t18-l3, chefmate_8_frypan_1_xy_m: [0.14, -0.18], moka_pot_1_xy_m: [-0.14, 0.09]}
      - {id: t18-l4, chefmate_8_frypan_1_xy_m: [-0.08, -0.30], moka_pot_1_xy_m: [0.14, -0.02]}
      - {id: t18-l5, chefmate_8_frypan_1_xy_m: [0.08, -0.30], moka_pot_1_xy_m: [-0.14, -0.02]}
  - suite: libero_90
    task_id: 37
