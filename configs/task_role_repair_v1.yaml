schema: task-role-repair-v1
status: locked_before_expert_or_policy_outcomes
locked_at_utc: "2026-08-25T04:00:49Z"
scientific_question: >-
  Does a diagnosed object-role failure identify simulator demonstrations that repair two
  previously unsolved tasks more efficiently than equal-dose random demonstrations from the
  same generator, without regressing established capabilities?

policy:
  checkpoint: gs://openpi-assets/checkpoints/pi05_libero
  config: meridian_pi05_libero

