      reference_y_m: [-0.035, 0.035]
      minimum_center_separation_m: 0.11
      source_surfaces:
        table: {probability: 0.75, x_m: [-0.18, 0.16], y_m: [-0.24, -0.12]}
        microwave_top: {probability: 0.25, x_m: [-0.03, 0.03], y_m: [-0.30, -0.24]}
    contrastive_layouts:
      - {id: t37-l0, source_surface: microwave_top, source_xy_m: [-0.03, -0.30], reference_xy_m: [0.03, 0.03]}
