[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-harness"
version = "0.1.0"
description = "Policy-agnostic capability mapping and intervention harness"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.6,<1"]

[project.scripts]
meridian = "meridian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

